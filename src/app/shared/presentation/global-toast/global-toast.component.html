@if (toast(); as item) {
<div
  class="global-toast fixed right-4 top-4 z-[1000] flex w-[min(28rem,calc(100vw-2rem))] items-start gap-3 rounded-2xl border px-4 py-3.5 shadow-[0_18px_45px_rgba(3,14,9,0.22)] sm:right-6 sm:top-6"
  [class.global-toast-fading]="item.isFading"
  [attr.role]="item.type === 'error' ? 'alert' : 'status'"
  aria-live="polite"
  [style.background]="item.type === 'error' ? 'var(--color-danger-10)' : 'var(--color-emerald-15)'"
  [style.border-color]="item.type === 'error' ? 'var(--color-danger)' : 'var(--color-success)'"
  [style.color]="item.type === 'error' ? 'var(--color-danger)' : 'var(--color-text-primary)'"
>
  <span
    class="mt-0.5 flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-full text-sm font-bold"
    [style.background]="item.type === 'error' ? 'var(--color-danger)' : 'var(--color-success)'"
    style="color: var(--color-text-inverse)"
    aria-hidden="true"
  >
    @if (item.type === 'error') { ! } @else { ✓ }
  </span>

  <p class="flex-1 text-sm leading-5" style="font-family: var(--font-body)">
    {{ item.message }}
  </p>

  <button
    type="button"
    (click)="dismiss()"
    class="flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-full text-lg leading-none transition hover:bg-black/10"
    [attr.aria-label]="closeLabel"
    [title]="closeLabel"
  >
    ×
  </button>
</div>
}
